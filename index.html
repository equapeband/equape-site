/* swarm: procedural canvas animation (not a video file) */
body{position:relative;overflow-x:hidden}
#swarm{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}

<script>
// equape swarm: procedural canvas animation (not a video file). A small crisp cluster of insect-like specks drifting slowly. No blur.
function startSwarm(canvas, opts) {
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = (opts && opts.count) || 420;
  var P = [], seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  for (var i = 0; i < N; i++) {
    var loose = rnd() < 0.14;
    P.push({ a: rnd() * 6.2832, r: (loose ? 1.4 + rnd() * 1.6 : Math.pow(rnd(), 0.8) * 1.1), w: (0.25 + rnd() * 0.6) * (rnd() < 0.5 ? -1 : 1), f: 0.3 + rnd() * 0.9, o: rnd() * 6.2832, s: rnd() < 0.2 ? 3 : 2, hue: rnd() });
  }
  var w = 0, h = 0, dpr = 1, raf = 0, t0 = performance.now();
  function size() {
    var r = canvas.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, Math.round(r.width * dpr)); h = Math.max(1, Math.round(r.height * dpr));
    canvas.width = w; canvas.height = h;
  }
  function draw(now) {
    var qt = /[?&]t=([\d.]+)/.exec(location.search), t = qt ? parseFloat(qt[1]) : (reduce ? 3 : (now - t0) / 1000);
    var m = Math.min(w, h), base = m * 0.16;
    // slow wandering centre, like a drifting cursor
    var cx = w * (0.5 + 0.34 * Math.sin(t * 0.09 + 0.6) + 0.08 * Math.sin(t * 0.23)), cy = h * (0.5 + 0.30 * Math.sin(t * 0.07 + 2.1) + 0.07 * Math.sin(t * 0.19 + 1));
    var breathe = 1 + 0.07 * Math.sin(t * 1.4);
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < N; i++) {
      var p = P[i], ang = p.a + t * p.w, rad = base * p.r * breathe * (1 + 0.25 * Math.sin(t * p.f + p.o));
      var lag = p.r > 1.3 ? 0.6 : 0; // loose ones trail behind the centre a little
      var lx = lag ? (Math.sin((t - 1.5) * 0.09 + 0.6) - Math.sin(t * 0.09 + 0.6)) * w * 0.34 * lag : 0;
      var x0 = cx + lx + Math.cos(ang) * rad * 1.2, y0 = cy + Math.sin(ang + p.o) * rad * 0.9; /* slow travelling wave */ var x = Math.round(x0 + Math.sin(y0 / (m * 0.09) - t * 0.7) * base * 0.22), y = Math.round(y0 + Math.sin(x0 / (m * 0.11) + t * 0.55) * base * 0.3);
      var sz = Math.max(1, Math.round(p.s * dpr * 0.8));
      ctx.fillStyle = p.hue > 0.85 ? 'rgba(240,170,200,0.95)' : 'rgba(215,200,250,' + (0.55 + 0.45 * p.hue) + ')';
      ctx.fillRect(x, y, sz, sz);
    }
  }
  function loop(now) { draw(now); raf = requestAnimationFrame(loop); }
  size(); window.addEventListener('resize', function () { size(); if (reduce) draw(0); });
  if (reduce) { draw(0); } else { raf = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () { if (reduce) return; if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(loop); });
  return { draw: draw, stop: function () { cancelAnimationFrame(raf); } };
}

startSwarm(document.getElementById("swarm"));
</script>
